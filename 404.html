<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepWiser</title>
  <meta name="description" content="A friend shared their RepWiser training profile with you.">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="robots" content="noindex">

  <!-- This file is GitHub Pages' catch-all. Two purposes:
       1. SPA-style fallback for `/u/<username>` — those paths have no
          backing index.html, so GH Pages serves THIS file (HTTP 404).
          The JS detects the `/u/<x>` pattern and renders the same UI as
          /u/index.html.
       2. Real 404 page for any other unmatched path.

       HTTP 404 status is acceptable for the share-link case: browsers
       still render the body normally; iOS Universal Links match on
       path, not status; OG unfurlers that respect 404 fall back to
       the generic OG below — still on-brand.

       SHARED — the render code is a near-copy of /u/index.html. Keep
       them in sync. -->

  <meta property="og:title" content="A RepWiser training profile">
  <meta property="og:description" content="See goal, plan, and recent workouts. Get RepWiser to follow.">
  <meta property="og:url" content="https://repwiser.fit/">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="RepWiser">
  <meta property="og:image" content="https://repwiser.fit/og/share-default.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #0b0d0c;
      --s1:        #131614;
      --s2:        #1a1e1b;
      --s3:        #222720;
      --border:    rgba(255,255,255,0.07);
      --bup:       rgba(255,255,255,0.13);
      --text:      #ede8e0;
      --muted:     rgba(237,232,224,0.48);
      --muted2:    rgba(237,232,224,0.28);
      --amber:     #f5a521;
      --amber-h:   #f8b93d;
      --amber-glo: rgba(245,165,33,0.14);
      --amber-dk:  rgba(245,165,33,0.08);
      --green:     #5dac83;
      font-family: 'Outfit', sans-serif;
      font-feature-settings: "ss01", "cv11";
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='1'/></svg>");
      opacity: 0.032;
      pointer-events: none;
      z-index: 9999;
    }

    .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(245,165,33,0.10) 0%, transparent 65%);
      top: -200px; right: -160px;
    }
    .orb-2 {
      width: 460px; height: 460px;
      background: radial-gradient(circle, rgba(30,55,40,0.7) 0%, transparent 70%);
      bottom: 20%; left: -160px;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { width: min(720px, calc(100% - 36px)); margin: 0 auto; position: relative; z-index: 1; }

    header {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
      background: rgba(11,13,12,0.78);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
    }
    nav {
      min-height: 62px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
      color: var(--text);
    }
    .mark {
      width: 32px; height: 32px; border-radius: 9px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #1c1c18, #2e2514);
      border: 1px solid rgba(245,165,33,0.22);
      color: var(--amber);
      font-weight: 800; font-size: 14px;
      box-shadow: 0 0 0 3px rgba(245,165,33,0.06), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .nav-cta {
      background: var(--amber); color: #100e07;
      font-weight: 700; padding: 8px 14px; border-radius: 10px;
      font-size: 13px; box-shadow: 0 4px 16px rgba(245,165,33,0.22);
      transition: all 0.18s ease;
    }
    .nav-cta:hover { background: var(--amber-h); transform: translateY(-1px); }

    main { padding: 28px 0 96px; }

    /* ── Identity hero (same as /u/index.html) ──────────────────── */
    .identity {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 10px; padding: 26px 0 22px;
      position: relative;
    }
    .avatar-stage {
      position: relative;
      width: 112px; height: 112px;
      display: grid; place-items: center;
      isolation: isolate;
    }
    .avatar-stage::before {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,165,33,0.20) 0%, transparent 60%);
      filter: blur(38px);
      z-index: 0;
      animation: glowPulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowPulse {
      0%,100% { opacity: 0.55; transform: scale(1); }
      50%     { opacity: 0.85; transform: scale(1.06); }
    }
    /* Conic gradient ring around the avatar. Static (no rotation) —
       see /u/index.html for the rationale: nested transforms made the
       photo rotate when the ring spun, so we keep the gradient fixed. */
    .avatar-ring {
      position: relative; z-index: 1;
      width: 104px; height: 104px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(
        from 200deg,
        var(--amber) 0deg,
        rgba(93,172,131,0.45) 140deg,
        rgba(245,165,33,0.18) 240deg,
        var(--amber) 360deg
      );
    }
    .avatar {
      width: 100%; height: 100%; border-radius: 50%;
      background: linear-gradient(160deg, var(--s2), var(--s3));
      display: grid; place-items: center;
      font-size: 38px; font-weight: 700; color: var(--amber);
      letter-spacing: -0.02em;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }
    .avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .display-name {
      font-size: clamp(30px, 5.2vw, 40px);
      font-weight: 800; letter-spacing: -0.035em; line-height: 1.02;
      margin-top: 14px;
    }
    .handle {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 14px; font-weight: 500;
      cursor: pointer; padding: 4px 10px; border-radius: 999px;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }
    .handle:hover { background: var(--s2); color: var(--text); }
    .handle .copy-glyph { width: 12px; height: 12px; opacity: 0.55; transition: opacity 0.15s; }
    .handle:hover .copy-glyph { opacity: 1; }
    .bio {
      color: var(--muted); font-size: 14.5px; line-height: 1.55;
      max-width: 480px; margin-top: 10px; padding: 0 12px;
    }
    .location {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted2); font-size: 12px; font-weight: 500; margin-top: 4px;
    }

    .toast {
      position: fixed; left: 50%; top: 32px;
      transform: translate(-50%, -16px);
      background: var(--s2); color: var(--text);
      border: 1px solid var(--bup);
      padding: 10px 16px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 200;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    .pills {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin-top: 18px; padding: 0 8px;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--s1); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; color: var(--text);
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s, background 0.15s;
    }
    .pill:hover { border-color: var(--bup); background: var(--s2); }
    .pill .pill-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px rgba(245,165,33,0.55);
    }
    .pill .pill-lbl { color: var(--muted); font-weight: 500; }
    .pill .pill-rule { width: 3px; height: 3px; border-radius: 50%; background: var(--muted2); }

    .totals {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin-top: 28px;
    }
    .total {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 14px;
      display: flex; flex-direction: column; gap: 4px; text-align: center;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .total:hover { border-color: var(--bup); transform: translateY(-2px); }
    .total .total-num {
      font-size: 28px; font-weight: 800; color: var(--text);
      letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .total .total-lbl {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.07em; text-transform: uppercase; margin-top: 2px;
    }

    .section-head {
      display: flex; align-items: center; gap: 10px;
      margin: 44px 0 16px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--amber); opacity: 0.85;
    }
    .section-head::before {
      content: ''; width: 18px; height: 1.5px;
      background: var(--amber); border-radius: 1px;
    }

    .post {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; margin-bottom: 12px;
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      animation: postIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(60ms * var(--stagger, 0));
    }
    .post:hover {
      border-color: var(--bup); transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    @keyframes postIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .post-media-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: var(--s2); overflow: hidden;
    }
    .post-media { width: 100%; height: 100%; object-fit: cover; display: block; }
    .post-media-wrap::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
      background: linear-gradient(180deg, transparent 0%, rgba(11,13,12,0.7) 100%);
      pointer-events: none;
    }
    .post-body { padding: 14px 16px 16px; }
    .post-title {
      font-size: 17px; font-weight: 700; color: var(--text);
      letter-spacing: -0.015em; margin-bottom: 4px;
    }
    .post-meta { font-size: 12px; color: var(--muted); font-weight: 500; }
    .post-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .stat-chip {
      background: var(--s2); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600; color: var(--text);
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .stat-chip:hover {
      border-color: rgba(245,165,33,0.25);
      box-shadow: 0 0 0 3px rgba(245,165,33,0.06);
    }
    .post-engagement {
      display: flex; gap: 14px; margin-top: 12px;
      color: var(--muted); font-size: 12px; font-weight: 500;
    }
    .post-engagement span { display: inline-flex; align-items: center; gap: 4px; }
    .post-caption { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 8px; }

    .connect {
      margin-top: 40px; padding: 30px 24px 32px;
      background: linear-gradient(160deg, var(--s2), var(--s1));
      border: 1px solid rgba(245,165,33,0.18);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 14px 50px rgba(0,0,0,0.32);
      position: relative; overflow: hidden;
    }
    .connect::before {
      content: '';
      position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 200px;
      background: radial-gradient(ellipse, rgba(245,165,33,0.16) 0%, transparent 60%);
      pointer-events: none; filter: blur(20px);
    }
    .connect h2 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.025em;
      margin-bottom: 6px; line-height: 1.1; position: relative;
    }
    .connect h2 em {
      font-family: 'Instrument Serif', serif; font-style: italic;
      font-weight: 400; color: var(--amber);
    }
    .connect p {
      color: var(--muted); font-size: 14px; line-height: 1.55;
      margin-bottom: 20px; position: relative;
    }
    .connect-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; position: relative; }

    .app-store-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: #000; color: #fff;
      padding: 9px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      font-family: inherit;
    }
    .app-store-badge:hover {
      border-color: rgba(255,255,255,0.32);
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    }
    .app-store-badge svg.apple-glyph { width: 22px; height: 26px; flex-shrink: 0; fill: #fff; }
    .app-store-badge .badge-lines { display: flex; flex-direction: column; gap: 1px; line-height: 1; text-align: left; }
    .app-store-badge .badge-pre { font-size: 10px; font-weight: 500; letter-spacing: 0.02em; opacity: 0.85; }
    .app-store-badge .badge-name { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px; border-radius: 12px;
      font-size: 14px; font-weight: 650;
      transition: all 0.18s ease; cursor: pointer; border: none;
      font-family: inherit;
    }
    .btn-secondary {
      background: var(--s2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--s3); border-color: var(--bup); }

    .sk { animation: shimmer 1.4s ease-in-out infinite;
      background: linear-gradient(90deg, var(--s2) 0%, var(--s3) 50%, var(--s2) 100%);
      background-size: 200% 100%;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .sk-name   { width: 220px; height: 30px; margin-top: 14px; border-radius: 10px; }
    .sk-handle { width: 130px; height: 16px; margin-top: 8px; }
    .sk-pill   { width: 92px; height: 32px; border-radius: 999px; }

    .state {
      text-align: center; padding: 64px 20px 56px; position: relative;
    }
    .state-icon {
      width: 72px; height: 72px; border-radius: 18px;
      display: grid; place-items: center; margin: 0 auto 20px;
      background: linear-gradient(160deg, var(--s2), var(--s3));
      border: 1px solid var(--border);
      font-size: 30px; color: var(--amber); font-weight: 700;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      position: relative;
    }
    .state-icon::after {
      content: '';
      position: absolute; inset: -16px; border-radius: 22px;
      background: radial-gradient(circle, var(--amber-glo) 0%, transparent 60%);
      filter: blur(18px); z-index: -1;
    }
    .state h2 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.025em;
      margin-bottom: 10px; line-height: 1.1;
    }
    .state p {
      color: var(--muted); font-size: 14.5px; line-height: 1.55;
      max-width: 380px; margin: 0 auto 24px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 22px 0; margin-top: 40px;
      font-size: 12px; color: var(--muted2);
    }
    .footer-inner {
      display: flex; flex-wrap: wrap; gap: 14px;
      align-items: center; justify-content: space-between;
    }
    .footer-links { display: flex; gap: 18px; }
    .footer-links a:hover { color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .avatar-stage::before { animation: none !important; }
      html { scroll-behavior: auto; }
    }

    @media (max-width: 540px) {
      .totals { grid-template-columns: repeat(2, 1fr); }
      .post-media-wrap { aspect-ratio: 4/3; }
      .display-name { font-size: 28px; }
      .connect-row { flex-direction: column; }
      .app-store-badge, .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="/">
          <span class="mark">R</span>
          <span>RepWiser</span>
        </a>
        <a class="nav-cta" href="https://apps.apple.com/app/repwiser/id6744890930"
           target="_blank" rel="noopener">Get the app</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="root">
    <!-- Skeleton (shown until JS works out which mode to render in). -->
    <section class="identity" id="skeleton" aria-hidden="true">
      <div class="avatar-stage">
        <div class="avatar-ring sk" style="padding:0;"></div>
      </div>
      <div class="sk sk-name"></div>
      <div class="sk sk-handle"></div>
    </section>
  </main>

  <noscript>
    <div style="text-align:center; padding:48px 22px; color:rgba(237,232,224,0.7);">
      Enable JavaScript to view this RepWiser profile, or open this link on your iPhone with the RepWiser app installed.
    </div>
  </noscript>

  <div class="toast" id="toast" role="status" aria-live="polite">Link copied</div>

  <footer>
    <div class="wrap footer-inner">
      <a class="brand" href="/" style="font-size:14px;">
        <span class="mark" style="width:26px; height:26px; font-size:12px;">R</span>
        <span>RepWiser</span>
      </a>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    // ─────────────────────────────────────────────────────────────────
    // GitHub Pages catch-all SPA logic.
    //   - /u/<username>  → render the same share-link UI as /u/index.html
    //   - everything else → render a real 404
    //
    // SHARED — keep in sync with /u/index.html (same render fn names,
    // same payload contract).
    // ─────────────────────────────────────────────────────────────────

    const SUPABASE_URL = 'https://wqnbhfkrtfzniaibsvfa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxbmJoZmtydGZ6bmlhaWJzdmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODUwOTQsImV4cCI6MjA5MjU2MTA5NH0._5L7mY4ytooUxbZnvomO5b3zRTR6ESCXQ1qUx2tMoqc';
    const APP_STORE_URL = 'https://apps.apple.com/app/repwiser/id6744890930';
    const FN = SUPABASE_URL + '/functions/v1/public-profile-by-username';

    const APP_STORE_BADGE_HTML = `
      <a class="app-store-badge" href="${APP_STORE_URL}" target="_blank" rel="noopener" aria-label="Download on the App Store">
        <svg class="apple-glyph" viewBox="0 0 384 512" aria-hidden="true">
          <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
        </svg>
        <span class="badge-lines">
          <span class="badge-pre">Download on the</span>
          <span class="badge-name">App Store</span>
        </span>
      </a>`;

    function extractProfileUsernameFromPath() {
      const path = window.location.pathname.replace(/\/+$/, '');
      const parts = path.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0].toLowerCase() === 'u') {
        return parts[1].toLowerCase();
      }
      return '';
    }

    function escapeHtml(value) {
      if (value == null) return '';
      return String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function titleCase(slug) {
      if (!slug) return '';
      return slug.replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim();
    }
    function initialsFor(name, username) {
      const source = (name || username || 'R').trim();
      const parts = source.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return source.slice(0, 2).toUpperCase();
    }
    function formatDuration(seconds) {
      if (seconds == null || isNaN(seconds)) return '';
      const total = Math.max(0, Math.round(seconds));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }
    function formatVolume(kg) {
      if (kg == null || isNaN(kg)) return '';
      const value = Number(kg);
      if (value >= 1000) return (value / 1000).toFixed(1).replace(/\.0$/, '') + 'k kg';
      return Math.round(value) + ' kg';
    }
    function relativeTime(iso) {
      if (!iso) return '';
      const then = new Date(iso).getTime();
      if (isNaN(then)) return '';
      const diff = Date.now() - then;
      const min = 60_000, hr = 60 * min, day = 24 * hr, week = 7 * day;
      if (diff < hr)  return Math.max(1, Math.floor(diff / min)) + 'm ago';
      if (diff < day) return Math.floor(diff / hr) + 'h ago';
      if (diff < week) return Math.floor(diff / day) + 'd ago';
      return Math.floor(diff / week) + 'w ago';
    }
    function locationText(loc) {
      if (!loc) return '';
      const parts = [loc.city, loc.state, loc.country].map(p => (p || '').trim()).filter(Boolean);
      return parts.join(', ');
    }

    let toastTimer = null;
    function showToast(text) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = text;
      t.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('is-visible'), 1800);
    }

    function renderState(opts) {
      const { icon, title, body, primary, secondary } = opts;
      const root = document.getElementById('root');
      const primaryHtml = primary
        ? (primary.kind === 'badge'
            ? APP_STORE_BADGE_HTML
            : `<a class="btn" href="${primary.href}" style="background:var(--amber); color:#14100a;">${escapeHtml(primary.label)}</a>`)
        : '';
      root.innerHTML = `
        <section class="state">
          <div class="state-icon">${icon || '·'}</div>
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(body)}</p>
          <div class="connect-row" style="justify-content:center;">
            ${primaryHtml}
            ${secondary ? `<a class="btn btn-secondary" href="${secondary.href}">${escapeHtml(secondary.label)}</a>` : ''}
          </div>
        </section>`;
    }

    function renderRealNotFound() {
      document.title = 'Page not found · RepWiser';
      renderState({
        icon: '404',
        title: 'Page not found',
        body: "The link you followed is broken, or the page has moved. Head back to repwiser.fit or grab the app to get started.",
        primary:   { kind: 'link',  label: 'Back to home', href: '/' },
        secondary: { label: 'Get RepWiser', href: APP_STORE_URL },
      });
    }
    function renderProfileNotFound(username) {
      renderState({
        icon: '?',
        title: 'Profile not found',
        body: `We couldn't find @${username || 'that user'} on RepWiser. The username may have changed or the account may have been deleted.`,
        primary:   { kind: 'badge' },
        secondary: { label: 'Back to home', href: '/' },
      });
    }
    function renderDisabled() {
      renderState({
        icon: '🔒',
        title: 'This profile is no longer public',
        body: 'The athlete who shared this link has turned off their public profile page. Get RepWiser to discover other lifters and follow them inside the app.',
        primary:   { kind: 'badge' },
        secondary: { label: 'Back to home', href: '/' },
      });
    }
    function renderError() {
      renderState({
        icon: '!',
        title: "We couldn't load this profile",
        body: 'Something went wrong reaching RepWiser. Refresh the page in a moment — if it keeps failing, the service may be temporarily unavailable.',
        primary:   { kind: 'link', label: 'Try again', href: window.location.href },
        secondary: { label: 'Back to home', href: '/' },
      });
    }

    function buildPills(identity) {
      if (!identity) return '';
      const items = [];
      if (identity.goal)  items.push({ lbl: 'Goal',  val: titleCase(identity.goal),  dot: true });
      if (identity.level) items.push({ lbl: 'Level', val: titleCase(identity.level), dot: true });
      if (identity.trainingDaysPerWeek) {
        items.push({
          lbl: 'Plan',
          val: `${identity.trainingDaysPerWeek}×/wk` +
            (identity.sessionMinutes ? ` · ${identity.sessionMinutes}m` : ''),
          dot: true,
        });
      }
      // Body-measurement pills (start weight, target weight, height) are
      // intentionally NOT rendered. They're individual-body data and the
      // Edge Function no longer returns them anyway — this guard is
      // defense in depth so a future schema change can't accidentally
      // surface them on the share link.
      if (!items.length) return '';
      return `<div class="pills">` +
        items.map(p =>
          `<span class="pill">${p.dot ? `<span class="pill-dot"></span>` : ''}<span class="pill-lbl">${escapeHtml(p.lbl)}</span><span class="pill-rule"></span>${escapeHtml(p.val)}</span>`
        ).join('') +
        `</div>`;
    }

    function buildTotals(totals) {
      if (!totals) return '';
      const items = [];
      if (totals.sessions != null) items.push({ num: totals.sessions, lbl: 'Sessions' });
      if (totals.currentStreakDays != null && totals.currentStreakDays > 0) {
        items.push({ num: totals.currentStreakDays, lbl: 'Day streak' });
      }
      if (totals.weekIndex != null && totals.weekTarget != null) {
        items.push({ num: `${totals.weekIndex}/${totals.weekTarget}`, lbl: 'This week' });
      }
      if (totals.prCount != null && totals.prCount > 0) {
        items.push({ num: totals.prCount, lbl: 'PRs' });
      }
      if (!items.length) return '';
      return `<div class="totals">` +
        items.map(t =>
          `<div class="total"><div class="total-num">${escapeHtml(t.num)}</div><div class="total-lbl">${escapeHtml(t.lbl)}</div></div>`
        ).join('') +
        `</div>`;
    }

    function buildPosts(posts) {
      if (!posts || !posts.length) return '';
      const cards = posts.map((p, idx) => {
        const stats = (p.topStats && p.topStats.length)
          ? p.topStats
          : [
              p.durationSeconds ? formatDuration(p.durationSeconds) : null,
              p.totalVolumeKg   ? formatVolume(p.totalVolumeKg)     : null,
              p.totalSets       ? `${p.totalSets} sets`             : null,
            ].filter(Boolean);

        const media = p.mediaUrl
          ? `<div class="post-media-wrap"><img class="post-media" src="${escapeHtml(p.mediaUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`
          : '';

        const caption = p.caption && p.caption.trim()
          ? `<div class="post-caption">${escapeHtml(p.caption.trim())}</div>`
          : '';

        const engagement = (p.likeCount || p.commentCount)
          ? `<div class="post-engagement">
               ${p.likeCount    ? `<span>♥ ${p.likeCount}</span>`    : ''}
               ${p.commentCount ? `<span>💬 ${p.commentCount}</span>` : ''}
             </div>`
          : '';

        return `
          <article class="post" style="--stagger:${idx};">
            ${media}
            <div class="post-body">
              <div class="post-title">${escapeHtml(p.workoutName || 'Workout')}</div>
              <div class="post-meta">${escapeHtml(relativeTime(p.createdAt))}</div>
              <div class="post-stats">
                ${stats.map(s => `<span class="stat-chip">${escapeHtml(s)}</span>`).join('')}
              </div>
              ${caption}
              ${engagement}
            </div>
          </article>`;
      }).join('');
      return `<div class="section-head">Recent workouts</div>${cards}`;
    }

    function buildConnect(profile) {
      const name = profile.displayName || profile.username;
      const handle = profile.username;
      const universalLink = `https://repwiser.fit/u/${encodeURIComponent(handle)}`;
      return `
        <section class="connect">
          <h2>Connect with <em>${escapeHtml(name)}</em></h2>
          <p>Get RepWiser on iPhone to follow @${escapeHtml(handle)} and share your own training.</p>
          <div class="connect-row">
            ${APP_STORE_BADGE_HTML}
            <a class="btn btn-secondary" href="${universalLink}">Open in RepWiser</a>
          </div>
        </section>`;
    }

    function renderProfile(payload) {
      const profile = payload.profile || {};
      const name = profile.displayName || profile.username || 'Athlete';
      const handle = profile.username || '';
      const bio = (profile.bio || '').trim();
      const loc = locationText(profile.location);

      document.title = `${name} on RepWiser`;
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', `${name} on RepWiser`);
      if (handle) {
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.setAttribute('rel', 'canonical');
          document.head.appendChild(canonical);
        }
        canonical.setAttribute('href', `https://repwiser.fit/u/${handle}`);
      }

      const avatarHtml = profile.avatarUrl
        ? `<img src="${escapeHtml(profile.avatarUrl)}" alt="${escapeHtml(name)}'s avatar" referrerpolicy="no-referrer">`
        : escapeHtml(initialsFor(name, handle));

      const root = document.getElementById('root');
      root.innerHTML = `
        <section class="identity">
          <div class="avatar-stage">
            <div class="avatar-ring">
              <div class="avatar">${avatarHtml}</div>
            </div>
          </div>
          <div class="display-name">${escapeHtml(name)}</div>
          ${handle ? `
            <button class="handle" id="handleCopy" type="button" aria-label="Copy share link">
              <span>@${escapeHtml(handle)}</span>
              <svg class="copy-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          ` : ''}
          ${bio  ? `<div class="bio">${escapeHtml(bio)}</div>`         : ''}
          ${loc  ? `<div class="location">📍 ${escapeHtml(loc)}</div>` : ''}
          ${buildPills(profile.trainingIdentity)}
        </section>
        ${buildTotals(profile.totals)}
        <div id="progress"></div>
        ${buildPosts(payload.recentPosts)}
        ${buildConnect(profile)}`;

      const handleBtn = document.getElementById('handleCopy');
      if (handleBtn) {
        handleBtn.addEventListener('click', async () => {
          const url = `https://repwiser.fit/u/${handle}`;
          try {
            await navigator.clipboard.writeText(url);
            showToast('Link copied');
          } catch (e) {
            showToast('Couldn\'t copy — long-press the link instead');
          }
        });
      }
    }

    async function loadProfile(username) {
      const url = FN + '?username=' + encodeURIComponent(username);
      let response;
      try {
        response = await fetch(url, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          },
        });
      } catch (e) { renderError(); return; }

      if (response.status === 404) { renderProfileNotFound(username); return; }
      if (response.status === 410) { renderDisabled(); return; }
      if (!response.ok) { renderError(); return; }

      let payload;
      try { payload = await response.json(); }
      catch (e) { renderError(); return; }

      if (!payload || !payload.profile) { renderError(); return; }
      renderProfile(payload);
    }

    (function () {
      const username = extractProfileUsernameFromPath();
      if (!username) { renderRealNotFound(); return; }
      if (!/^[a-z0-9_]{2,32}$/.test(username)) { renderProfileNotFound(username); return; }
      loadProfile(username);
    })();
  </script>
</body>
</html>
