<?xml version="1.0" encoding="UTF-8"?>
<!--
  Static Open Graph card used by share-link pages.
  Renders the same for every shared profile because GitHub Pages
  can't generate dynamic OG images. 1200×630 — the canonical OG aspect
  for Facebook / iMessage / WhatsApp / Twitter unfurls.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="amberGlow" cx="78%" cy="20%" r="60%">
      <stop offset="0%"   stop-color="#f5a521" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5a521" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="forestGlow" cx="10%" cy="85%" r="55%">
      <stop offset="0%"   stop-color="#1f3a2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f3a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1c1c18"/>
      <stop offset="100%" stop-color="#2e2514"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0d0c"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>
  <rect width="1200" height="630" fill="url(#forestGlow)"/>

  <!-- Top brand row -->
  <g transform="translate(72,72)">
    <rect width="56" height="56" rx="14" fill="url(#markGrad)" stroke="rgba(245,165,33,0.32)" stroke-width="1"/>
    <text x="28" y="38" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
          font-size="28" font-weight="800" fill="#f5a521" text-anchor="middle"
          letter-spacing="-0.02em">R</text>
    <text x="76" y="36" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
          font-size="26" font-weight="700" fill="#ede8e0" letter-spacing="-0.02em">RepWiser</text>
  </g>

  <!-- Eyebrow chip -->
  <g transform="translate(72,256)">
    <rect width="232" height="38" rx="999" fill="#f5a521" fill-opacity="0.10"
          stroke="#f5a521" stroke-opacity="0.32" stroke-width="1"/>
    <circle cx="22" cy="19" r="4" fill="#f5a521"/>
    <text x="40" y="25" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#f5a521" letter-spacing="0.12em">SHARED PROFILE</text>
  </g>

  <!-- Main headline -->
  <text x="72" y="376" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
        font-size="86" font-weight="800" fill="#ede8e0" letter-spacing="-0.04em">Train with a</text>
  <text x="72" y="466" font-family="'Instrument Serif',Georgia,serif"
        font-size="86" font-style="italic" fill="#f5a521" letter-spacing="-0.02em">sharper plan.</text>

  <!-- Sub-line -->
  <text x="72" y="540" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="500" fill="rgba(237,232,224,0.68)" letter-spacing="-0.005em">
    A coach-first workout app for iPhone and Apple Watch.
  </text>

  <!-- Bottom-right App Store chip + URL -->
  <g transform="translate(836,520)">
    <rect width="290" height="62" rx="14" fill="#000"
          stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Apple glyph -->
    <g transform="translate(20,16) scale(0.062)">
      <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
            fill="#ffffff"/>
    </g>
    <text x="72" y="28" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
          font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)">Download on the</text>
    <text x="72" y="50" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
          font-size="22" font-weight="600" fill="#ffffff" letter-spacing="-0.01em">App Store</text>
  </g>

  <!-- Top-right URL hint -->
  <text x="1128" y="100" font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
        font-size="16" font-weight="600" fill="rgba(237,232,224,0.4)" text-anchor="end"
        letter-spacing="0.04em">repwiser.fit</text>
</svg>
